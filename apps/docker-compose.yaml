name: wordpress-headless

services:
  wordpress:
    build:
      context: ./wordpress
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      WP_ENV: development
      WP_DEBUG_LOG: /tmp/wordpress-debug.log
      WP_HOME: "http://localhost:${WORDPRESS_PORT:-8080}"
      WP_SITEURL: "http://localhost:${WORDPRESS_PORT:-8080}/wp"
      DB_HOST: db
      DB_NAME: "${MYSQL_DATABASE:-wordpress}"
      DB_USER: "${MYSQL_USER:-wordpress}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-wordpress-local}"
    volumes:
      - wordpress-uploads:/var/www/html/web/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-wordpress}"
      MYSQL_USER: "${MYSQL_USER:-wordpress}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-wordpress-local}"
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql
          --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  wordpress-uploads:
  mysql-data:
